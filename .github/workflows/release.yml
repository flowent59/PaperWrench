name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing Release Please tag to resume
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  publish-and-verify:
    runs-on: ubuntu-latest
    outputs:
      commit: ${{ steps.version.outputs.commit }}
      release_id: ${{ steps.release.outputs.release_id }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out the reviewed workflow tools
        uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          path: workflow
          persist-credentials: false

      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
          path: source
          fetch-depth: 0
          persist-credentials: false

      - name: Validate tag, source and application versions
        id: version
        working-directory: source
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          EVENT_SHA: ${{ github.event_name == 'push' && github.sha || '' }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_REF: ${{ github.ref }}
        run: |
          python - <<'PY'
          import json
          import os
          import re
          import subprocess
          import tomllib
          from pathlib import Path

          tag = os.environ["RELEASE_TAG"]
          event_name = os.environ["EVENT_NAME"]
          event_ref = os.environ["EVENT_REF"]
          if event_name == "workflow_dispatch" and event_ref != "refs/heads/main":
              raise SystemExit("Manual release recovery must run from main")
          if event_name not in ("push", "workflow_dispatch"):
              raise SystemExit(f"Unsupported release event: {event_name}")
          if not re.fullmatch(r"v(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)", tag):
              raise SystemExit(f"Invalid release tag: {tag!r}; expected vMAJOR.MINOR.PATCH")
          version = tag[1:]
          head = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          tagged = subprocess.check_output(["git", "rev-parse", f"refs/tags/{tag}^{{commit}}"], text=True).strip()
          event_sha = os.environ["EVENT_SHA"]
          event = subprocess.check_output(["git", "rev-parse", f"{event_sha}^{{commit}}"], text=True).strip() if event_sha else None
          if head != tagged or (event is not None and head != event):
              raise SystemExit("The checkout does not match the pushed tag commit")
          subprocess.run(["git", "merge-base", "--is-ancestor", "HEAD", "origin/main"], check=True)
          backend = tomllib.loads(Path("backend/pyproject.toml").read_text())["project"]["version"]
          frontend = json.loads(Path("frontend/package.json").read_text())["version"]
          lock = json.loads(Path("frontend/package-lock.json").read_text())
          manifest = json.loads(Path(".release-please-manifest.json").read_text())["."]
          source = Path("backend/src/paperwrench/__init__.py").read_text()
          package = re.search(r'^__version__ = "([^"]+)"(?:\s+# x-release-please-version)?$', source, re.MULTILINE)
          versions = (backend, frontend, lock["version"], lock["packages"][""]["version"], package.group(1) if package else None)
          if any(value != version for value in (*versions, manifest)):
              raise SystemExit(f"Tag {tag} disagrees with application versions: {versions}")
          if version not in Path("CHANGELOG.md").read_text():
              raise SystemExit(f"Generated changelog has no entry for {version}")
          with Path(os.environ["GITHUB_OUTPUT"]).open("a") as output:
              output.write(f"version={version}\n")
              output.write(f"commit={head}\n")
              epoch = subprocess.check_output(["git", "show", "-s", "--format=%ct", "HEAD"], text=True).strip()
              output.write(f"source_date_epoch={epoch}\n")
          print(f"Validated {tag} at {head}")
          PY

      - name: Require the Release Please draft or published Release
        id: release
        working-directory: source
        env:
          RELEASE_PLEASE_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          EXPECTED_COMMIT: ${{ steps.version.outputs.commit }}
        run: python ../workflow/scripts/release_gate.py verify

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR for publication
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Detect an already published version
        id: existing
        working-directory: source
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          RELEASE_COMMIT: ${{ steps.version.outputs.commit }}
        run: |
          image="ghcr.io/flowent59/paperwrench:${RELEASE_VERSION}"
          current=$(git show origin/main:.release-please-manifest.json | python -c 'import json,sys; print(json.load(sys.stdin)["."])')
          if [ "$current" = "$RELEASE_VERSION" ]; then
            echo "check_latest=true" >> "$GITHUB_OUTPUT"
          else
            echo "check_latest=false" >> "$GITHUB_OUTPUT"
          fi
          if digest=$(docker buildx imagetools inspect "$image" --format '{{.Manifest.Digest}}' 2>/dev/null); then
            docker pull "$image" >/dev/null
            revision=$(docker image inspect "$image" --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')
            if [ "$revision" != "$RELEASE_COMMIT" ]; then
              echo "::error::Version tag already exists for a different commit"
              exit 1
            fi
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "digest=$digest" >> "$GITHUB_OUTPUT"
            if [ "$current" = "$RELEASE_VERSION" ]; then
              latest=ghcr.io/flowent59/paperwrench:latest
              latest_digest=$(docker buildx imagetools inspect "$latest" --format '{{.Manifest.Digest}}' 2>/dev/null || true)
              if [ "$latest_digest" != "$digest" ]; then
                docker buildx imagetools create --tag "$latest" "ghcr.io/flowent59/paperwrench@${digest}"
              fi
            fi
          else
            if [ "$current" != "$RELEASE_VERSION" ]; then
              echo "::error::Refusing to publish an older tag and move latest away from $current"
              exit 1
            fi
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build the tagged checkout and publish both tags
        id: build
        if: steps.existing.outputs.exists != 'true'
        uses: docker/build-push-action@v6
        with:
          context: ./source
          push: true
          platforms: linux/amd64
          build-args: |
            VCS_REF=${{ steps.version.outputs.commit }}
            SOURCE_DATE_EPOCH=${{ steps.version.outputs.source_date_epoch }}
          tags: |
            ghcr.io/flowent59/paperwrench:${{ steps.version.outputs.version }}
            ghcr.io/flowent59/paperwrench:latest
          provenance: mode=max
          sbom: true

      - name: Validate the image pulled from GHCR on disposable Paperless
        working-directory: source
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          RELEASE_DIGEST: ${{ steps.build.outputs.digest || steps.existing.outputs.digest }}
          CHECK_LATEST: ${{ steps.existing.outputs.check_latest }}
        run: bash ../workflow/.github/scripts/validate_published_image.sh

  publish-github-release:
    needs: publish-and-verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out the reviewed workflow tools
        uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false

      - name: Publish the reviewed Release Please notes after image validation
        env:
          RELEASE_PLEASE_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          EXPECTED_COMMIT: ${{ needs.publish-and-verify.outputs.commit }}
          RELEASE_ID: ${{ needs.publish-and-verify.outputs.release_id }}
        run: python scripts/release_gate.py publish
