name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A PR that supersedes itself should not keep burning runners.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "22"

jobs:
  release-metadata:
    name: Release metadata and PR title
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Check version synchronization and Conventional Commit title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python scripts/check_release_metadata.py

  # ---------------------------------------------------------------- static
  backend-lint:
    name: Backend / lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      # From the root, so /ruff.toml applies and scripts/ is linted too.
      - run: ruff check .

  backend-typecheck:
    name: Backend / typecheck (mypy strict)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      # From the root, so /mypy.ini applies: strict mode plus the pydantic
      # plugin. Run from backend/ it would silently degrade to defaults.
      - run: mypy backend/src tests scripts

  # ------------------------------------------------------------ unit tests
  # No I/O of any kind. Pure logic: merge semantics, models, scrubbing.
  backend-unit:
    name: Backend / unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      # Run from the repository root: that is where pytest.ini lives, and
      # where testpaths resolves. See the comment in pytest.ini.
      - name: Unit tests
        run: pytest tests/backend/unit --cov=paperwrench --cov-report=term-missing

  # ------------------------------------------- integration against a MOCK
  # These prove what PaperWrench SENDS and how it reacts. They prove nothing
  # about Paperless itself: the server here is respx, and a mock agrees with
  # whatever we told it. Never reported as evidence about Paperless.
  backend-integration-mocked:
    name: Backend / integration tests (mocked Paperless)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Client tests against respx (NOT a real Paperless)
        run: pytest tests/backend/integration_mocked -s

  # Explicit required check for authentication/isolation invariants.  These
  # tests also run in their broader suites, but this named job makes a branch
  # protection rule able to require the security boundary directly.
  backend-multi-user-security:
    name: Security / multi-user regressions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Session, IDOR, revocation and permission-race regressions
        run: |
          pytest \
            tests/backend/integration_mocked/test_multi_user_security.py \
            tests/backend/unit/test_auth.py \
            tests/backend/unit/test_user_isolation.py \
            tests/backend/unit/test_jobs.py::test_fresh_preconditions_and_already_at_target

  # --------------------------------------------- live against real Paperless
  # These jobs can add version-scoped VERIFIED_LIVE evidence. They write and
  # deletes, which is exactly why it runs against a throwaway container and
  # is double-gated by the suite's own conftest.
  backend-live-paperless:
    name: Backend / live tests (Paperless-ngx latest)
    runs-on: ubuntu-latest
    env:
      PAPERLESS_IMAGE: ghcr.io/paperless-ngx/paperless-ngx:latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Pull sandbox images for this run
        run: docker compose -f docker-compose.dev.yml --profile golden pull

      - name: Record the resolved Paperless image
        run: |
          digest=$(docker image inspect "$PAPERLESS_IMAGE" --format '{{join .RepoDigests " "}}')
          echo "Paperless image: $PAPERLESS_IMAGE"
          echo "Resolved digest: $digest"
          test -n "$digest" || { echo "::error::Paperless image has no pull digest"; exit 1; }
          {
            echo "### Paperless-ngx latest"
            echo "Image: \`$PAPERLESS_IMAGE\`"
            echo "Resolved digest: \`$digest\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Start Paperless-ngx (+ PostgreSQL, Redis)
        run: docker compose -f docker-compose.dev.yml up -d

      - name: Wait for Paperless to answer
        run: |
          for i in $(seq 1 90); do
            if curl -fsS -o /dev/null http://127.0.0.1:8010/accounts/login/; then
              echo "Paperless is up after ${i} attempt(s)"
              exit 0
            fi
            sleep 5
          done
          echo "::error::Paperless never became reachable"
          docker compose -f docker-compose.dev.yml logs --tail=200 paperless
          exit 1

      - name: Verify and record the version reported by Paperless
        run: |
          token=$(curl -fsS -X POST http://127.0.0.1:8010/api/token/ \
            -H 'Content-Type: application/json' \
            -d '{"username":"admin","password":"admin"}' | jq -r .token)
          test -n "$token" && test "$token" != null || { echo "::error::Paperless token missing"; exit 1; }
          headers=$(mktemp)
          status=$(curl -sS -o /dev/null -D "$headers" -w '%{http_code}' \
            -H "Authorization: Token ${token}" \
            -H 'Accept: application/json; version=10' \
            'http://127.0.0.1:8010/api/documents/?page_size=1')
          version=$(tr -d '\r' < "$headers" | awk 'tolower($1)=="x-version:"{print $2}' | tail -1)
          if [ -z "$version" ]; then
            curl -sS -o /dev/null -D "$headers" \
              -H "Authorization: Token ${token}" \
              -H 'Accept: application/json' \
              'http://127.0.0.1:8010/api/documents/?page_size=1'
            version=$(tr -d '\r' < "$headers" | awk 'tolower($1)=="x-version:"{print $2}' | tail -1)
          fi
          echo "Paperless reports X-Version: ${version}; API v10 returned HTTP ${status}"
          echo "Reported version: \`${version:-missing}\`; API v10: HTTP $status" >> "$GITHUB_STEP_SUMMARY"
          if [ -z "$version" ] || [ "$status" != 200 ]; then
            echo "::error::Paperless $PAPERLESS_IMAGE reports X-Version '${version:-missing}' and HTTP $status for API v10"
            exit 1
          fi
          echo "PAPERWRENCH_EXPECTED_PAPERLESS_VERSION=$version" >> "$GITHUB_ENV"
          echo "PAPERWRENCH_PAPERLESS_TOKEN=${token}" >> "$GITHUB_ENV"

      - name: Seed the Golden Dataset
        run: docker compose -f docker-compose.dev.yml --profile golden run --rm golden

      - name: Wait for the Golden Dataset to be fully consumed
        # Paperless consumes uploads asynchronously (OCR, thumbnailing, ...).
        # The seed step above queues 17 documents and only applies custom
        # field values to whichever of them have already been consumed by
        # the time it runs its second pass - it does not block until the
        # queue drains. Starting the live tests immediately after could hit
        # a library that still has fewer than 17 documents visible, which
        # made TestPagination::test_client_walks_every_page skip instead of
        # run (VERIFIED_LIVE regression found post-M2). Poll until all 17
        # are visible, then re-run the seeder's second pass so every
        # document that was still "not consumed yet" gets its field values.
        run: |
          for i in $(seq 1 60); do
            count=$(curl -fsS -H "Authorization: Token ${PAPERWRENCH_PAPERLESS_TOKEN}" \
              'http://127.0.0.1:8010/api/documents/?page_size=1' | jq -r '.count')
            echo "Documents visible: ${count}/17 (attempt ${i})"
            if [ "${count}" -ge 17 ]; then
              exit 0
            fi
            sleep 3
          done
          echo "::error::Golden Dataset did not finish consuming within the timeout"
          exit 1

      - name: Re-apply custom field values to any newly-consumed document
        run: docker compose -f docker-compose.dev.yml --profile golden run --rm golden

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build compiled acceptance SPA and install Chromium
        working-directory: frontend
        run: |
          npm ci
          npm run build
          npx playwright install --with-deps chromium

      - name: Live tests, including compiled Chromium journey
        env:
          PAPERWRENCH_ALLOW_LIVE_TESTS: "true"
          PAPERWRENCH_PAPERLESS_URL: http://127.0.0.1:8010
        run: pytest tests/backend/live -v --junitxml=paperless-live-latest.xml

      - name: Reject skipped live tests and record counts
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          import os
          from pathlib import Path

          report = Path("paperless-live-latest.xml")
          root = ET.parse(report).getroot()
          suites = root.findall("testsuite") or [root]
          tests = sum(int(s.get("tests", 0)) for s in suites)
          skipped = sum(int(s.get("skipped", 0)) for s in suites)
          failures = sum(int(s.get("failures", 0)) + int(s.get("errors", 0)) for s in suites)
          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a", encoding="utf-8") as summary:
              summary.write(f"Live suite: {tests} tests, {skipped} skipped, {failures} failed.\n")
          if tests == 0 or skipped or failures:
              raise SystemExit(f"Live suite incomplete: {tests} tests, {skipped} skipped, {failures} failed")
          PY

      - name: Preserve live test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paperless-live-latest
          path: paperless-live-latest.xml
          if-no-files-found: ignore

      - name: Paperless logs (on failure)
        if: failure()
        run: docker compose -f docker-compose.dev.yml logs --tail=300

      - name: Teardown
        if: always()
        run: docker compose -f docker-compose.dev.yml down -v || true

  # --------------------------------------------------------- migrations
  backend-migrations:
    name: Backend / migrations
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      PAPERWRENCH_DATABASE_URL: sqlite+pysqlite:///./ci-migrate.db
      PAPERLESS_URL: http://paperless.invalid
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Apply from scratch
        run: alembic upgrade head

      - name: No pending model changes
        # Autogenerating against an up-to-date database must produce nothing;
        # otherwise a model was edited without a migration.
        run: |
          alembic revision --autogenerate -m "ci drift check" >/dev/null
          latest=$(ls -t src/paperwrench/migrations/versions/*.py | head -1)
          if grep -qE '^\s+op\.(create|drop|add|alter)_' "$latest"; then
            echo "::error::Model changes are not covered by a migration:"
            cat "$latest"
            exit 1
          fi
          rm -f "$latest"

  # ---------------------------------------------------------- frontend
  frontend-lint:
    name: Frontend / lint (eslint)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint

  frontend-typecheck:
    name: Frontend / typecheck (tsc)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc -b

  frontend-test:
    name: Frontend / tests (vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run test

  frontend-i18n:
    name: Frontend / translations (FR/EN)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Reject incomplete or malformed translation catalogues
        run: npm run i18n:check
      - name: Test translation validator failure modes
        run: npm run test:i18n-validator

  frontend-build:
    name: Frontend / build (vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx vite build

  # ------------------------------------------------------------ docker
  image-security-policy:
    name: Security / image policy regressions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: python -m pip install pytest pytest-asyncio
      - name: Verify pass, findings, technical failures and exception boundaries
        run: pytest tests/backend/unit/test_image_security.py --noconftest --junitxml=image-policy-tests.xml
      - name: Retain blocking regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: image-security-policy-regressions
          path: image-policy-tests.xml
          if-no-files-found: error
          retention-days: 90

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: paperwrench:ci
          build-args: VCS_REF=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Container starts, migrates and answers /system/health
        run: |
          docker run -d --name pw \
            --read-only --tmpfs /tmp --cap-drop ALL --security-opt no-new-privileges \
            -e PAPERLESS_URL=http://paperless.invalid \
            -p 8000:8000 paperwrench:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/api/v1/system/health; then
              echo && echo "healthy"
              break
            fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:8000/api/v1/system/health | grep -q '"status":"ok"'
          # The SPA must be served from the same origin as the API.
          curl -fsS http://127.0.0.1:8000/ | grep -qi '<div id="root">'

      - name: Installed release and nested compiled SPA routes
        run: docker exec -i pw python < scripts/smoke_release.py

      - name: Native TLS, credentials and absence of installation tools
        run: |
          # pip check is a build gate, after setuptools/wheel removal and before pip removal.
          docker exec pw python -c 'import importlib.util; assert all(importlib.util.find_spec(name) is None for name in ("pip", "setuptools", "wheel", "pkg_resources", "ensurepip"))'
          docker exec -i pw python < scripts/smoke_native_runtime.py

      - name: Populated SQLite backup restores on the installed runtime
        run: |
          docker exec -i pw python -c '
          import sys
          from pathlib import Path
          from tempfile import TemporaryDirectory

          fixture = {"__name__": "release_migration_fixture"}
          exec(compile(sys.stdin.read(), "test_release_migrations.py", "exec"), fixture)
          with TemporaryDirectory(prefix="paperwrench-restore-") as directory:
              fixture["test_m12_backup_restore_and_idempotent_release_upgrade"](Path(directory))
          print("Populated backup: migration, repeated upgrade and SQLite integrity OK")
          ' < tests/backend/unit/test_release_migrations.py

      - name: Paperless probe requires a per-user session
        run: |
          body=$(curl -sS -w '\n%{http_code}' http://127.0.0.1:8000/api/v1/system/paperless)
          echo "$body"
          echo "$body" | tail -1 | grep -q '^401$'
          echo "$body" | head -n -1 | grep -q '"code":"AUTH_REQUIRED"'

      - name: Runs as a non-root user
        run: |
          uid=$(docker exec pw id -u)
          test "$uid" != "0" || { echo "::error::container runs as root"; exit 1; }

      - name: No inherited setuid or setgid executables
        run: |
          privileged_files=$(docker exec pw find /usr -type f -perm /6000 -print)
          test -z "$privileged_files" || { echo "::error::unexpected privileged files: $privileged_files"; exit 1; }

      - name: Container has no deployment-wide Paperless token
        run: |
          docker exec pw sh -c 'test -z "${PAPERLESS_TOKEN:-}" && test -z "${PAPERLESS_TOKEN_FILE:-}"'

      - name: Public and unauthenticated responses contain no credentials
        run: |
          for path in /api/v1/system/paperless /api/v1/system/info /api/v1/system/health; do
            if curl -sS "http://127.0.0.1:8000${path}" | grep -Eqi 'paperless[_-]?token|ci-placeholder'; then
              echo "::error::credential material leaked into ${path}"
              exit 1
            fi
          done

      - name: Audit the exact runtime image from this build
        if: always() && steps.build.outcome == 'success'
        uses: ./.github/actions/image-audit
        with:
          image: ${{ steps.build.outputs.imageid }}
          approved-ref: ${{ github.event.pull_request.base.sha || github.sha }}

      - name: Teardown
        if: always()
        run: docker rm -f pw || true
