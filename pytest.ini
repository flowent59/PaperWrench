# Pytest configuration lives at the repository root, deliberately.
#
# It used to live in backend/pyproject.toml, which worked only by accident:
# pytest picks its rootdir from the arguments, so `pytest` from backend/ found
# the config while `pytest ../tests/backend/integration_mocked` did not - and a
# missing config means asyncio_mode is unset, so every async test ERRORS with
# "async def functions are not natively supported" instead of running.
#
# That is the worst possible failure mode for a test suite: it looks like a
# code defect, and a tired reader could "fix" it by deleting tests. Putting the
# file at the root makes the rootdir the repository in every invocation, from
# any working directory, with or without explicit paths.
#
# Corollary: run pytest FROM THE REPOSITORY ROOT. `testpaths` below is resolved
# relative to the invocation directory, so `cd backend && pytest` collects
# nothing. The Makefile and CI both cd to the root; do the same by hand.

[pytest]
testpaths = tests/backend
pythonpath = scripts
asyncio_mode = auto
addopts = -q --strict-markers
markers =
    live: tests requiring a real Paperless instance (opt-in, deselected by default)
filterwarnings =
    error::DeprecationWarning:paperwrench.*
