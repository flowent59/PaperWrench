; mypy configuration lives at the repository root, deliberately.
;
; It used to live in backend/pyproject.toml with `mypy_path = "src"`, a
; relative path that only resolved when mypy was invoked from backend/. Run
; from anywhere else, mypy silently fell back to its defaults: no pydantic
; plugin, no strict mode, and a flood of spurious errors that look like real
; ones. Same failure mode as the pytest rootdir and ruff `src` problems
; documented in /pytest.ini and /ruff.toml.

[mypy]
python_version = 3.11
strict = True
warn_unreachable = True
warn_unused_ignores = True
disallow_any_generics = True
no_implicit_reexport = True
plugins = pydantic.mypy
; `scripts` is on the path because the dev seeders import each other as
; siblings: they are executed with scripts/ as the working directory (see the
; `seed` and `golden` services in docker-compose.dev.yml), not as a package.
mypy_path = backend/src:scripts
explicit_package_bases = True
namespace_packages = True

[mypy-alembic.*]
ignore_errors = True

[mypy-migrations.*]
ignore_errors = True
