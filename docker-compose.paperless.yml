# Add PaperWrench to an existing Paperless Docker network. Pull the versioned
# GHCR image by default; a local build remains available as described in docs.
services:
  paperwrench:
    image: ${PAPERWRENCH_IMAGE:-ghcr.io/flowent59/paperwrench:0.5.0} # x-release-please-version
    pull_policy: always
    restart: unless-stopped
    ports:
      - "${PAPERWRENCH_HTTP_PORT:-8000}:8000"
    environment:
      PAPERLESS_URL: "http://${PAPERLESS_SERVICE:-paperless}:8000"
      PAPERWRENCH_SESSION_TTL_SECONDS: ${PAPERWRENCH_SESSION_TTL_SECONDS:-28800}
      PAPERWRENCH_SESSION_REVALIDATE_SECONDS: ${PAPERWRENCH_SESSION_REVALIDATE_SECONDS:-300}
      PAPERWRENCH_SESSION_COOKIE_SECURE: ${PAPERWRENCH_SESSION_COOKIE_SECURE:-false}
      PAPERWRENCH_REMEMBER_TOKENS: ${PAPERWRENCH_REMEMBER_TOKENS:-true}
      PAPERWRENCH_CREDENTIAL_KEY: ${PAPERWRENCH_CREDENTIAL_KEY:-}
    volumes:
      - paperwrench_data:/data
    networks:
      - paperless
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  paperwrench_data:

networks:
  paperless:
    external: true
    name: ${PAPERLESS_DOCKER_NETWORK:?set the existing Paperless Docker network name}
