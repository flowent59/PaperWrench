<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="description"
      content="PaperWrench - power tools for Paperless-ngx. Independent project, not affiliated with Paperless-ngx."
    />
    <title>PaperWrench</title>
    <script>
      // Applied before first paint to avoid a light flash on a dark install.
      try {
        const stored = localStorage.getItem('paperwrench.theme')
        const dark =
          stored === 'dark' ||
          (stored !== 'light' &&
            window.matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.classList.toggle('dark', dark)
      } catch {
        /* localStorage unavailable: keep the default */
      }
    </script>
  <script src="https://sites.super.myninja.ai/_assets/ninja-daytona-script.js"></script>
</head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
