[project]
name = "paperwrench"
version = "0.2.0"
description = "PaperWrench - Power tools for Paperless-ngx"
requires-python = ">=3.11"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "PaperWrench contributors" }]
keywords = ["paperless-ngx", "documents", "bulk-edit", "data-quality"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Web Environment",
  "Framework :: FastAPI",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Office/Business",
]

dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "httpx>=0.27",
  "sqlalchemy>=2.0.30",
  "alembic>=1.13",
  "structlog>=24.1",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
  "pytest-cov>=5.0",
  "respx>=0.21",
  "ruff>=0.6",
  "mypy>=1.11",
  "types-python-dateutil>=2.9",
]

[project.urls]
Homepage = "https://github.com/flowent59/PaperWrench"
Repository = "https://github.com/flowent59/PaperWrench"
Issues = "https://github.com/flowent59/PaperWrench/issues"

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/paperwrench"]
# Alembic revisions and the built SPA are data files inside the package, so
# an installed wheel can migrate and serve without a source checkout.
artifacts = [
    "src/paperwrench/migrations/**",
    "src/paperwrench/static/**",
]

# ---------------------------------------------------------------------------
# Ruff
# ---------------------------------------------------------------------------
# Ruff configuration deliberately lives in /ruff.toml at the repository
# root, not here. Keeping it under backend/ meant its `src` and
# per-file-ignores paths had to escape upwards with `../`, which only
# resolved when ruff was invoked from backend/ - so scripts/ was never
# linted. See the comment in /ruff.toml.

# ---------------------------------------------------------------------------
# mypy (strict)
# ---------------------------------------------------------------------------
# mypy configuration deliberately lives in /mypy.ini at the repository
# root, not here. Its `mypy_path` is relative, so keeping it under
# backend/ made strict mode and the pydantic plugin apply only when mypy
# was invoked from that directory. See the comment in /mypy.ini.

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
# Pytest configuration deliberately lives in /pytest.ini at the repository
# root, not here. Keeping it under backend/ made pytest's rootdir depend on the
# arguments passed, so running a suite by path silently lost asyncio_mode and
# every async test errored out. See the comment in /pytest.ini.

[tool.coverage.run]
source = ["src/paperwrench"]
branch = true
