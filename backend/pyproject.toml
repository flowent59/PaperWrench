[project]
name = "paperwrench"
version = "0.1.0.dev0"
description = "PaperWrench - Power tools for Paperless-ngx"
requires-python = ">=3.11"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "PaperWrench contributors" }]
keywords = ["paperless-ngx", "documents", "bulk-edit", "data-quality"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Web Environment",
  "Framework :: FastAPI",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Office/Business",
]

dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "httpx>=0.27",
  "sqlalchemy>=2.0.30",
  "alembic>=1.13",
  "structlog>=24.1",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
  "pytest-cov>=5.0",
  "respx>=0.21",
  "ruff>=0.6",
  "mypy>=1.11",
  "types-python-dateutil>=2.9",
]

[project.urls]
Homepage = "https://github.com/flowent59/PaperWrench"
Repository = "https://github.com/flowent59/PaperWrench"
Issues = "https://github.com/flowent59/PaperWrench/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/paperwrench"]
# Alembic revisions and the built SPA are data files inside the package, so
# an installed wheel can migrate and serve without a source checkout.
artifacts = [
    "src/paperwrench/migrations/**",
    "src/paperwrench/static/**",
]

# ---------------------------------------------------------------------------
# Ruff
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "../tests"]

[tool.ruff.lint]
select = [
  "E",    # pycodestyle errors
  "W",    # pycodestyle warnings
  "F",    # pyflakes
  "I",    # isort
  "B",    # flake8-bugbear
  "C4",   # comprehensions
  "UP",   # pyupgrade
  "ASYNC",# flake8-async
  "S",    # bandit
  "T20",  # no print
  "SIM",  # simplify
  "RET",  # return
  "PTH",  # pathlib
  "RUF",
]
ignore = [
  "S101",  # assert is fine (tests)
  "B008",  # FastAPI Depends() in defaults is idiomatic
]

[tool.ruff.lint.per-file-ignores]
# Tests assert on hardcoded fixtures and may print while debugging.
"../tests/**" = ["S", "T20"]
"**/tests/**" = ["S", "T20"]
# Alembic templates and autogenerated revisions are machine-written.
"src/paperwrench/migrations/**" = ["I001", "E501", "W291", "F401"]

[tool.ruff.lint.isort]
known-first-party = ["paperwrench"]
force-single-line = true

# ---------------------------------------------------------------------------
# mypy (strict)
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
warn_unused_ignores = true
disallow_any_generics = true
no_implicit_reexport = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
explicit_package_bases = true
namespace_packages = true

[[tool.mypy.overrides]]
module = ["alembic.*", "migrations.*"]
ignore_errors = true

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["../tests/backend"]
asyncio_mode = "auto"
addopts = "-q --strict-markers"
markers = [
  "live: tests requiring a real Paperless instance (opt-in, deselected by default)",
]
filterwarnings = ["error::DeprecationWarning:paperwrench.*"]

[tool.coverage.run]
source = ["src/paperwrench"]
branch = true
