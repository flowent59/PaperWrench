# Ruff configuration lives at the repository root, deliberately.
#
# It used to live in backend/pyproject.toml with `src = ["src", "../tests"]`
# and per-file-ignores keyed on "../tests/**". Those relative escapes only
# resolved when ruff happened to be invoked from backend/, which meant the
# effective ruleset depended on the caller's working directory, and
# scripts/ was never linted at all. Same failure mode as the pytest rootdir
# problem documented in /pytest.ini: config found by accident is config that
# will eventually be missed.

line-length = 100
target-version = "py311"
src = ["backend/src", "tests", "scripts"]

exclude = [
  ".venv",
  "backend/.venv",
  "frontend",
]

[lint]
select = [
  "E",    # pycodestyle errors
  "W",    # pycodestyle warnings
  "F",    # pyflakes
  "I",    # isort
  "B",    # flake8-bugbear
  "C4",   # comprehensions
  "UP",   # pyupgrade
  "ASYNC",# flake8-async
  "S",    # bandit
  "T20",  # no print
  "SIM",  # simplify
  "RET",  # return
  "PTH",  # pathlib
  "RUF",
]
ignore = [
  "S101",  # assert is fine (tests)
  "B008",  # FastAPI Depends() in defaults is idiomatic
]

[lint.per-file-ignores]
# Tests assert on hardcoded fixtures and may print while debugging.
"tests/**" = ["S", "T20"]
# Dev seeders are operator tools: printing is their entire user interface, and
# they legitimately embed the sandbox's throwaway credentials.
"scripts/**" = ["S", "T20"]
# Alembic templates and autogenerated revisions are machine-written.
"backend/src/paperwrench/migrations/**" = ["I001", "E501", "W291", "F401"]

[lint.isort]
known-first-party = ["paperwrench"]
force-single-line = true
